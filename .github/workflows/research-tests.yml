name: Research tests

on:
  push:
    branches: [main, research-discovery]
  pull_request:
    branches: [main]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas tzdata
      - name: Compile Python sources
        run: python -m compileall -q research tests multi_event_reaction_analyzer.py stage_c_xauusd_analyzer_corrected.py stage_d_weighted_forecast.py
      - name: Run research tests
        run: python -m unittest discover -s tests -v
